plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
    accessWidenerPath = file("src/client/resources/korppu.accesswidener")
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "korppu" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    String imguiVersion = "1.90.0"
    implementation include("io.github.spair:imgui-java-binding:${imguiVersion}")
    implementation include("io.github.spair:imgui-java-lwjgl3:${imguiVersion}") {
        exclude group: "org.lwjgl"
        exclude group: "org.lwjgl.lwjgl"
    }
    implementation include("io.github.spair:imgui-java-natives-linux:${imguiVersion}")
    implementation include("io.github.spair:imgui-java-natives-windows:${imguiVersion}")
    implementation include("io.github.spair:imgui-java-natives-macos:${imguiVersion}")

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'

    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}


tasks.withType(ProcessResources).configureEach {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = project.archives_base_name
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

def releaseDir = file("$buildDir/../releases")

task moveJar(type: Copy) {
    dependsOn jar
    from jar.archiveFile
    into releaseDir
    rename { "${project.base.archivesName.get()}.jar" }
}

task buildAndMoveJar {
    group = "release"
    description = "Builds the mod and moves the jar to the release directory"
    dependsOn build, moveJar
}