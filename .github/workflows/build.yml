name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        run: |
          base="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then
            version="$base+build.$GITHUB_RUN_NUMBER"
          else
            version="$base+${GITHUB_SHA::7}"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Collect jar
        run: |
          mkdir dist
          cp "build/libs/korppu-${{ steps.version.outputs.version }}.jar" "dist/korppu-${{ steps.version.outputs.version }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: korppu-${{ steps.version.outputs.version }}
          path: dist/*.jar

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: korppu ${{ steps.version.outputs.base }} (build ${{ github.run_number }})
          files: dist/*.jar
          generate_release_notes: true
          make_latest: true
